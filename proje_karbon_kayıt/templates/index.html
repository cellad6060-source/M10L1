<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Karbon Ayak İzi Hesaplayıcı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-success text-white p-4 rounded-top-4 text-center">
                        <h2 class="fw-bold mb-0"><i class="bi bi-tree-fill me-2"></i>Günlük Karbon & Enerji Girişi</h2>
                        <small class="text-white-50">Bugünkü tüketim alışkanlıklarını kategorilere göre detaylandır</small>
                    </div>
                    <div class="card-body p-4">
                        <form action="/" method="POST">
                            <!-- Ev & Enerji -->
                            <h5 class="text-success border-bottom pb-2 mb-3"><i class="bi bi-house-door-fill me-2"></i>1. Ev & Enerji</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label font-weight-bold">Elektrik Tüketimi (kWh):</label>
                                    <input type="number" step="0.1" name="ev_elektrik" class="form-control" placeholder="Örn: 8.5" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label font-weight-bold">Doğal Gaz Tüketimi (m³):</label>
                                    <input type="number" step="0.1" name="dogalgaz" class="form-control" placeholder="Örn: 3.0" required>
                                </div>
                            </div>

                            <!-- Ulaşım -->
                            <h5 class="text-primary border-bottom pb-2 mb-3"><i class="bi bi-car-front-fill me-2"></i>2. Ulaşım</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label font-weight-bold">Şehir İçi Araç (km):</label>
                                    <input type="number" step="0.1" name="sehir_ici_arac" class="form-control" placeholder="Örn: 15" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label font-weight-bold">Toplu Taşıma (km):</label>
                                    <input type="number" step="0.1" name="toplu_tasima" class="form-control" placeholder="Örn: 10" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label font-weight-bold">Uçak Yolculuğu (km):</label>
                                    <input type="number" step="0.1" name="ucak_mesafe" class="form-control" placeholder="Örn: 0" value="0">
                                </div>
                            </div>

                            <!-- Yaşam & Beslenme -->
                            <h5 class="text-warning border-bottom pb-2 mb-3"><i class="bi bi-egg-fried me-2"></i>3. Beslenme & Tüketim</h5>
                            <div class="mb-4">
                                <label class="form-label font-weight-bold">Bugün Tüketilen Etli Öğün Sayısı:</label>
                                <input type="number" step="1" name="et_tuketimi" class="form-control" placeholder="Örn: 1 veya 2" required>
                            </div>

                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold rounded-3 shadow-sm">
                                <i class="bi bi-calculator me-2"></i>Hesapla ve Özeti Gör
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
